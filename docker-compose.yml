services:
  db:
    image: mysql:8.0
    restart: unless-stopped
  # Synology Container Manager: el .env debe estar en la misma carpeta que este compose.
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-budget_manager}
      MYSQL_USER: ${MYSQL_USER:-budget}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-budget_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    volumes:
      - db_data:/var/lib/mysql
      # .sql evita scripts .sh con CRLF en Windows (error /bin/bash^M: bad interpreter).
      - ./database/schema_tables.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    # Sin "ports": MySQL solo en la red Docker. Evita en Synology el error
    # "driver failed programming external connectivity" (3306 ocupado por MariaDB/DSM).
    # Para DBeaver/HeidiSQL desde el PC: docker compose -f docker-compose.yml -f docker-compose.db-port.yml up -d
    # MYSQL_PWD evita -p en línea de comandos (caracteres raros en la contraseña) y suele ser más fiable.
    # start_period largo: en NAS el primer init de InnoDB + import del schema puede superar 15–30 s.
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 10s
      retries: 36
      start_period: 120s

  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-budget_manager}
      DB_USER: ${MYSQL_USER:-budget}
      DB_PASS: ${MYSQL_PASSWORD:-budget_secret}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:18080}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      ALLOW_BOOTSTRAP: ${ALLOW_BOOTSTRAP:-1}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "80"

  # El front de React se compila dentro de la imagen en el BUILD.
  # Si cambias código en frontend/ y sigues viendo la versión vieja en el puerto WEB_PORT:
  #   docker compose build web && docker compose up -d web
  # o de una vez: docker compose up --build -d
  # Para iterar sin rebuild de imagen: npm run build en frontend/ y usa docker-compose.dev.yml
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    ports:
      # Synology / otras apps suelen usar 8080; por defecto 18080 para evitar
      # "driver failed programming external connectivity".
      - "${WEB_PORT:-18080}:80"
    depends_on:
      - api

volumes:
  db_data:
